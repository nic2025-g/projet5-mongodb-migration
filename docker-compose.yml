services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER requis}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:?MONGO_PASS requis}
    volumes:
      - mongo_portfolio_test_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - healthcare_network

  migration:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
    command: python migrate_to_mongo.py
    networks:
      - healthcare_network

volumes:
  mongo_portfolio_test_data:

networks:
  healthcare_network:
    driver: bridge